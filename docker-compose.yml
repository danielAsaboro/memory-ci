services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.3
    command: start-single-node --insecure --store=/cockroach/cockroach-data
    ports:
      - "26258:26257"
      - "8082:8080"
    volumes:
      - memory-ci-cockroach:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  memory-ci-cockroach:
